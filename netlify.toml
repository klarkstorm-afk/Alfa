# Alpha Travel — Netlify settings (all files in the repository root)
[build]
  publish = "."
  functions = "."
  command = ""

# CRM file (encrypted statuses and notes) is never served to visitors
[[redirects]]
  from = "/crm/*"
  to = "/404.html"
  status = 404
  force = true

# the site asks for data/site.json and bg/N.jpg; until the admin saves
# real files there, serve the copies from the root
[[redirects]]
  from = "/data/site.json"
  to = "/site.json"
  status = 200

[[redirects]]
  from = "/bg/:file"
  to = "/:file"
  status = 200

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/site.json"
  [headers.values]
    Cache-Control = "no-cache"
