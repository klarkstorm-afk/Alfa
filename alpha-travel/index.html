    tb(['Usługa','Cel','Co otrzymuje'],[['geojs.io, ipapi.co','Uzupełnienie kraju i miasta w formularzu','Adres IP']])+'<p>Czcionki strony są na naszym serwerze i nie przekazują Twojego IP osobom trzecim. Bez zgody kraj wybierasz sam lub klikasz „Ustal po IP” w formularzu.</p>']],
  [[t('cs_an'),t('cs_an'),t('cs_an')],['<p>Не используем.</p><p>Хостинг Netlify ведёт технические журналы (IP-адрес, время запроса) для безопасности и работы сайта.</p>','<p>Not used.</p><p>The Netlify hosting keeps technical logs (IP address, request time) for security and operation of the site.</p>','<p>Nie używamy.</p><p>Hosting Netlify prowadzi logi techniczne (adres IP, czas żądania) dla bezpieczeństwa i działania strony.</p>']],
  [['Как изменить выбор','How to change your choice','Jak zmienić wybór'],['<p>Кнопка «'+t('cs_set')+'» внизу каждой страницы. Ещё можно очистить данные сайта в настройках браузера.</p><p><button type="button" class="btn sm" data-cc="open">'+t('cs_set')+'</button></p>','<p>Use “'+t('cs_set')+'” at the bottom of every page, or clear the site data in your browser settings.</p><p><button type="button" class="btn sm" data-cc="open">'+t('cs_set')+'</button></p>','<p>Przycisk „'+t('cs_set')+'” na dole każdej strony. Możesz też wyczyścić dane strony w ustawieniach przeglądarki.</p><p><button type="button" class="btn sm" data-cc="open">'+t('cs_set')+'</button></p>']]
  ]};

  var terms={t:t('lg_terms'),s:[
  [['1. Кто мы','1. Who we are','1. Kim jesteśmy'],[`<p>${N}, ${A}, ИНН ${INN}, бренд ${B}. Связь: ${E}, ${PH}. Все реквизиты — на странице «${lk('legal',t('lg_legal'))}».</p>`,`<p>${N}, ${A}, Tax ID (INN) ${INN}, brand ${B}. Contact: ${E}, ${PH}. Full details: ${lk('legal',t('lg_legal'))}.</p>`,`<p>${N}, ${A}, numer podatkowy (INN) ${INN}, marka ${B}. Kontakt: ${E}, ${PH}. Pełne dane: ${lk('legal',t('lg_legal'))}.</p>`]],
  [['2. Что можно делать на сайте','2. What the site offers','2. Usługi świadczone drogą elektroniczną'],[
    '<p>Смотреть туры и отели, собирать «Свой тур» с примерной ценой, отправлять заявки и отзывы, заказывать мерч. Это бесплатно. Нужен современный браузер с включённым JavaScript. Нельзя отправлять незаконное, оскорбительное или чужие персональные данные.</p>',
    '<p>Browse tours and hotels, build a custom tour with an estimated price, send requests and reviews, order merch. It is free of charge. You need a modern browser with JavaScript enabled. You may not submit unlawful or abusive content or other people’s personal data.</p>',
    '<p>Przeglądanie wycieczek i hoteli, tworzenie „Własnej wycieczki” z orientacyjną ceną, wysyłanie zgłoszeń i opinii, zamawianie gadżetów. Usługi są bezpłatne. Potrzebna jest nowoczesna przeglądarka z włączonym JavaScript. Zabronione jest przesyłanie treści bezprawnych, obraźliwych lub cudzych danych osobowych. Umowa o świadczenie tych usług zawierana jest z chwilą rozpoczęcia korzystania ze strony i rozwiązuje się z chwilą jej opuszczenia.</p>']],
  [['3. Заявка — это ещё не договор','3. A request is not yet a contract','3. Zgłoszenie to jeszcze nie umowa'],[
    '<ol class="lgl"><li>Вы отправляете заявку.</li><li>Мы уточняем наличие мест и итоговую цену.</li><li>До договора присылаем программу, проживание, транспорт, итоговую цену со всеми платежами, паспортно-визовые требования, условия отмены и информацию о ваших правах.</li><li>Заключаем договор письменно или по email.</li><li>Оплата: '+PAY+'.</li></ol>',
    '<ol class="lgl"><li>You send a request.</li><li>We check availability and the final price.</li><li>Before the contract we send the itinerary, accommodation, transport, the final price with all charges, passport and visa requirements, cancellation terms and information about your rights.</li><li>We conclude the contract in writing or by email.</li><li>Payment: '+PAY+'.</li></ol>',
    '<ol class="lgl"><li>Wysyłasz zgłoszenie.</li><li>Sprawdzamy dostępność miejsc i cenę końcową.</li><li>Przed zawarciem umowy przesyłamy program, zakwaterowanie, transport, cenę końcową ze wszystkimi opłatami, wymogi paszportowe i wizowe, warunki rezygnacji oraz informację o Twoich prawach.</li><li>Zawieramy umowę na piśmie lub mailowo.</li><li>Płatność: '+PAY+'.</li></ol>']],
  [['4. Цены','4. Prices','4. Ceny'],[
    ul(['Основная валюта цен — сом (KGS). Цены итоговые: с налогами и обязательными сборами. Что не входит (например, перелёт), подписано рядом с ценой.','Если вы выбрали другую валюту, сумма в ней справочная — по курсу на сайте. В договоре с клиентами из Кыргызстана цена и расчёты — только в сомах.','«от» — самая низкая цена за человека среди ближайших доступных дат.','Цены «Своего тура» примерные — точную цену назовём в предложении.','После договора цену можно изменить, только если это прямо указано в договоре и связано с ценой топлива, налогами и сборами или курсом валют, и не позднее чем за 20 дней до начала поездки. Если рост больше 8%, вы можете отказаться без платы.']),
    ul(['The base currency is the Kyrgyz som (KGS). Prices are final, including taxes and mandatory fees. Anything not included (e.g. flights) is stated next to the price.','If you choose another currency, the amount is for reference only, at the site’s exchange rate. For clients in Kyrgyzstan, the contract price and payments are in som only.','“From” is the lowest per-person price among the upcoming available dates.','Custom tour prices are estimates; we give the exact price in the offer.','After the contract, the price may change only if the contract expressly allows it, because of fuel costs, taxes and fees or exchange rates, and no later than 20 days before the start. If the increase exceeds 8%, you may withdraw free of charge.']),
    ul(['Podstawową walutą cen jest som kirgiski (KGS). Ceny są końcowe: z podatkami i obowiązkowymi opłatami. To, czego cena nie obejmuje (np. lot), opisano przy cenie.','Jeśli wybierzesz inną walutę, kwota jest orientacyjna — według kursu na stronie. W umowie z klientami z Kirgistanu cena i rozliczenia są wyłącznie w somach.','„od” to najniższa cena za osobę spośród najbliższych dostępnych terminów.','Ceny „Własnej wycieczki” są orientacyjne — dokładną cenę podamy w ofercie.','Po zawarciu umowy cena może się zmienić tylko, jeśli umowa wyraźnie to przewiduje, z powodu kosztów paliwa, podatków i opłat lub kursów walut, i nie później niż 20 dni przed rozpoczęciem. Przy wzroście ponad 8% możesz odstąpić bez opłat.'])]],
  [['5. Если вы отменяете поездку','5. If you cancel','5. Jeśli rezygnujesz'],[
    ul(['Отменить можно в любой момент до начала поездки.',`За ${F} дней и более — бесплатно.`,`За ${H}–${F1} дней — удерживаем 50% стоимости.`,`Менее чем за ${H} дней — стоимость не возвращается.`,'Невозвратные билеты и тарифы отелей — по правилам перевозчика или отеля.','Если в месте назначения случились чрезвычайные обстоятельства (опасность, стихийное бедствие и т.п.), которые существенно мешают поездке, — отмена бесплатная, вернём всё.']),
    ul(['You may cancel at any time before the trip starts.',`${F} or more days before: free.`,`${H}–${F1} days before: we retain 50% of the price.`,`Less than ${H} days before: no refund.`,'Non-refundable tickets and hotel rates follow the carrier’s or hotel’s rules.','If unavoidable and extraordinary circumstances at the destination (danger, natural disaster, etc.) significantly affect the trip, cancellation is free and we refund everything.']),
    ul(['Możesz zrezygnować w dowolnym momencie przed rozpoczęciem podróży.',`${F} dni lub więcej przed — bezpłatnie.`,`${H}–${F1} dni przed — potrącamy 50% ceny.`,`Mniej niż ${H} dni przed — cena nie podlega zwrotowi.`,'Bilety i taryfy hotelowe bezzwrotne — według zasad przewoźnika lub hotelu.','W razie nieuniknionych i nadzwyczajnych okoliczności w miejscu docelowym (zagrożenie, klęska żywiołowa itp.), które znacząco wpływają na podróż, rezygnacja jest bezpłatna i zwracamy całą kwotę.'])]],
  [['6. Если меняем или отменяем мы','6. If we change or cancel','6. Jeśli my zmieniamy lub odwołujemy'],[
    '<p>Если нам придётся существенно изменить условия, мы сразу сообщим: вы сможете согласиться или отказаться с полным возвратом. Если поездку отменяем мы, вернём всё, что вы заплатили, не позднее 14 дней.</p><p>Поездку можно передать другому человеку, сообщив нам не позднее чем за 7 дней до начала. Фактические доп. расходы (например, перевыпуск билетов) оплачиваются отдельно.</p>',
    '<p>If we have to change essential terms significantly, we tell you at once: you may accept or withdraw with a full refund. If we cancel the trip, we refund everything you paid within 14 days.</p><p>You may transfer the trip to another person by telling us at least 7 days before the start. Actual additional costs (e.g. reissuing tickets) are paid separately.</p>',
    '<p>Jeśli będziemy musieli znacząco zmienić istotne warunki, poinformujemy od razu: możesz się zgodzić albo odstąpić z pełnym zwrotem. Jeśli to my odwołamy podróż, zwrócimy wszystkie wpłaty w ciągu 14 dni.</p><p>Możesz przenieść podróż na inną osobę, informując nas najpóźniej 7 dni przed rozpoczęciem. Rzeczywiste dodatkowe koszty (np. ponowne wystawienie biletów) są płatne osobno.</p>']],
  [['7. Документы, визы, страховка','7. Documents, visas, insurance','7. Dokumenty, wizy, ubezpieczenie'],[
    '<p>Мы расскажем о паспортных и визовых требованиях. Решение о визе и въезде принимают консульство и пограничная служба — мы его не гарантируем. Вы отвечаете за действующий паспорт и документы.</p><p>Обязательное страхование туристов (медицинские расходы и несчастные случаи в поездке) оформляем по Правилам обязательного страхования туристов, утверждённым постановлением Кабинета Министров КР от 28.08.2026 № 593. Страховщик и договор: '+INS+'. Условия полиса пришлём до оплаты.</p>',
    '<p>We tell you about passport and visa requirements. Visa and entry decisions are made by consulates and border authorities — we cannot guarantee them. You are responsible for a valid passport and documents.</p><p>Mandatory tourist insurance (medical expenses and accidents during the trip) is arranged under the Rules of mandatory tourist insurance approved by Resolution No. 593 of the Cabinet of Ministers of the Kyrgyz Republic of 28.08.2026. Insurer and policy: '+INS+'. We send the policy terms before payment.</p>',
    '<p>Informujemy o wymogach paszportowych i wizowych. O wizie i wjeździe decydują konsulat i straż graniczna — nie możemy tego zagwarantować. Odpowiadasz za ważny paszport i dokumenty.</p><p>Obowiązkowe ubezpieczenie turystów (koszty leczenia i następstwa nieszczęśliwych wypadków w podróży) zapewniamy zgodnie z Zasadami obowiązkowego ubezpieczenia turystów zatwierdzonymi uchwałą Gabinetu Ministrów Republiki Kirgiskiej nr 593 z 28.08.2026. Ubezpieczyciel i umowa: '+INS+'. Warunki polisy prześlemy przed płatnością.</p>']],
  [['8. В поездке и претензии','8. During the trip and complaints','8. W trakcie podróży i reklamacje'],[
    '<p>Если что-то не так, сразу сообщите нам по '+PH+' или в WhatsApp — поможем на месте. Претензию можно направить на '+E+', по телефону или по адресу компании. Отвечаем в течение 14 дней.</p><p>Споры решаем переговорами, затем — в суде по законодательству Кыргызской Республики. Клиенты из ЕС сохраняют защиту, которую дают обязательные нормы права потребителей их страны; в Польше можно обратиться к районному или городскому потребительскому омбудсмену (rzecznik konsumentów) или в Торговую инспекцию.</p>',
    '<p>If something is wrong, tell us at once at '+PH+' or on WhatsApp — we will help on the spot. Complaints can be sent to '+E+', by phone or to the company address. We reply within 14 days.</p><p>Disputes are settled by negotiation, then in court under the law of the Kyrgyz Republic. Clients from the EU keep the protection of the mandatory consumer law of their country; in Poland you may contact a district or municipal consumer ombudsman (rzecznik konsumentów) or the Trade Inspection.</p>',
    '<p>Jeśli coś jest nie tak, zgłoś to od razu pod numerem '+PH+' lub na WhatsApp — pomożemy na miejscu. Reklamację można złożyć na '+E+', telefonicznie lub na adres firmy. Odpowiadamy w ciągu 14 dni.</p><p>Spory rozwiązujemy polubownie, a następnie przed sądem według prawa Republiki Kirgiskiej. Klienci z UE zachowują ochronę wynikającą z bezwzględnie obowiązujących przepisów konsumenckich swojego kraju; w Polsce możesz zwrócić się do powiatowego lub miejskiego rzecznika konsumentów albo do Inspekcji Handlowej.</p>']],
  [['9. Мерч','9. Merch','9. Gadżety'],[
    '<p>Заказ — через заявку. Договор заключается, когда мы подтвердим наличие, цену и стоимость доставки. Покупатель-потребитель из ЕС может отказаться от покупки в течение 14 дней со дня получения без объяснения причин: деньги вернём в течение 14 дней после получения товара, обратную пересылку оплачивает покупатель. Если товар с браком — заменим, исправим, снизим цену или вернём деньги. Права по законам о защите прав потребителей сохраняются.</p>',
    '<p>Orders are placed by request. The contract is concluded when we confirm availability, price and delivery cost. A consumer buyer from the EU may withdraw within 14 days of receipt without giving reasons: we refund within 14 days of getting the item back; return shipping is paid by the buyer. If an item is faulty, we replace, repair, reduce the price or refund. Statutory consumer rights are not affected.</p>',
    '<p>Zamówienie składa się przez zgłoszenie. Umowa zostaje zawarta, gdy potwierdzimy dostępność, cenę i koszt dostawy. Konsument z UE może odstąpić od umowy w ciągu 14 dni od otrzymania towaru bez podania przyczyny: zwrot pieniędzy nastąpi w ciągu 14 dni od otrzymania towaru z powrotem, koszt odesłania ponosi kupujący. Jeśli towar jest niezgodny z umową — wymienimy, naprawimy, obniżymy cenę lub zwrócimy pieniądze. Ustawowe prawa konsumenta pozostają bez zmian.</p>']],
  [['10. Отзывы','10. Reviews','10. Opinie'],[
    '<p>'+REV+' Мы не платим за отзывы и не публикуем выдуманные.</p>','<p>'+REV+' We do not pay for reviews or publish invented ones.</p>','<p>'+REV+' Nie płacimy za opinie i nie publikujemy zmyślonych.</p>']],
  [['11. Изменения условий','11. Changes to these terms','11. Zmiany regulaminu'],[
    '<p>Новые условия не меняют уже заключённые договоры. Актуальная редакция всегда на этой странице.</p>','<p>New terms do not change contracts already concluded. The current version is always on this page.</p>','<p>Nowe warunki nie zmieniają już zawartych umów. Aktualna wersja jest zawsze na tej stronie.</p>']]
  ]};

  var rights={t:t('lg_rights'),s:[
  [['Пакетный тур','Package travel','Impreza turystyczna'],[
    '<p>Если в поездку входят несколько услуг — например, перелёт, отель и трансфер, — это пакетный тур. Для путешественников из ЕС действуют правила Директивы (ЕС) 2015/2302 о пакетных турах, и мы соблюдаем их для всех клиентов. '+B+' отвечает за надлежащее исполнение всего тура. Перед заключением договора вы получите официальный формуляр информации.</p>',
    '<p>If your trip combines several services — for example a flight, hotel and transfer — it is a package. For travellers from the EU, the rules of the Package Travel Directive (EU) 2015/2302 apply, and we follow them for all clients. '+B+' is responsible for the proper performance of the whole package. You receive the official standard information form before the contract.</p>',
    '<p>Jeśli podróż łączy kilka usług — np. lot, hotel i transfer — jest to impreza turystyczna. Wobec podróżnych z UE stosuje się przepisy dyrektywy (UE) 2015/2302 w sprawie imprez turystycznych, a my przestrzegamy ich wobec wszystkich klientów. '+B+' odpowiada za należyte wykonanie całej imprezy. Przed zawarciem umowy otrzymasz oficjalny formularz informacyjny.</p>']],
  [['Ваши основные права','Your key rights','Twoje najważniejsze prawa'],[
    ul(['До договора вы получаете всю важную информацию о поездке.','Хотя бы одна компания отвечает за исполнение всех услуг тура.','У вас есть номер для экстренной связи.','Тур можно передать другому человеку, сообщив не позднее чем за 7 дней (возможны доп. расходы).','Цена может вырасти только при росте конкретных расходов (топливо, налоги, курс), если это есть в договоре, и не позднее чем за 20 дней до начала. Рост больше 8% — право отказаться. Если эти расходы снизились, цена тоже снижается.','Можно отказаться без платы с полным возвратом, если существенно изменились важные условия. Если тур отменили мы — полный возврат и при необходимости компенсация.','Можно отказаться без платы при чрезвычайных обстоятельствах в месте назначения, например при серьёзной угрозе безопасности.','Можно отказаться в любой момент до начала, заплатив разумную плату за отмену.','Если в поездке важные услуги нельзя выполнить, вам предложат замену без доплаты. Если услуги выполнены не по договору и мы это не исправили — можно отказаться от тура, получить снижение цены и/или компенсацию.','Если вы в трудной ситуации в поездке, мы обязаны помочь.','Если организатор станет неплатёжеспособным, ваши деньги вернут, а если в туре есть перевозка — обеспечат возвращение домой.']),
    ul(['You receive all essential information about the trip before the contract.','At least one trader is liable for the proper performance of all services in the package.','You are given an emergency contact number.','You may transfer the package to another person with notice of at least 7 days (additional costs may apply).','The price may rise only if specific costs rise (fuel, taxes, exchange rates), if the contract allows it, and no later than 20 days before the start. Above 8% you may withdraw. If those costs fall, the price falls too.','You may withdraw without a fee and get a full refund if essential elements change significantly. If we cancel, you get a full refund and compensation where appropriate.','You may withdraw without a fee in extraordinary circumstances at the destination, such as serious security problems.','You may withdraw at any time before the start for an appropriate termination fee.','If important services cannot be provided during the trip, you are offered suitable alternatives at no extra cost. If services are not performed as agreed and we do not remedy it, you may terminate, get a price reduction and/or compensation.','If you are in difficulty during the trip, we must provide assistance.','If the organiser becomes insolvent, your payments are refunded, and if transport is included, your repatriation is secured.']),
    ul(['Przed zawarciem umowy otrzymujesz wszystkie istotne informacje o podróży.','Co najmniej jeden przedsiębiorca odpowiada za należyte wykonanie wszystkich usług w imprezie.','Otrzymujesz numer telefonu alarmowego.','Możesz przenieść imprezę na inną osobę, powiadamiając nas co najmniej 7 dni przed rozpoczęciem (mogą wystąpić dodatkowe koszty).','Cena może wzrosnąć tylko przy wzroście konkretnych kosztów (paliwo, podatki, kursy walut), jeśli umowa to przewiduje, i nie później niż 20 dni przed rozpoczęciem. Przy wzroście ponad 8% możesz odstąpić. Jeśli te koszty spadną, cena też spada.','Możesz odstąpić bez opłat z pełnym zwrotem, jeśli istotne warunki znacząco się zmienią. Jeśli to my odwołamy imprezę — pełny zwrot i w razie potrzeby odszkodowanie.','Możesz odstąpić bez opłat w razie nadzwyczajnych okoliczności w miejscu docelowym, np. poważnego zagrożenia bezpieczeństwa.','Możesz odstąpić w dowolnym momencie przed rozpoczęciem za odpowiednią opłatą.','Jeśli w trakcie podróży ważnych usług nie można wykonać, otrzymasz odpowiednie zastępstwo bez dopłaty. Jeśli usługi nie są wykonywane zgodnie z umową, a my tego nie naprawimy — możesz rozwiązać umowę, uzyskać obniżkę ceny i/lub odszkodowanie.','Jeśli znajdziesz się w trudnej sytuacji w trakcie podróży, mamy obowiązek udzielić pomocy.','W razie niewypłacalności organizatora wpłaty zostaną zwrócone, a jeśli impreza obejmuje transport — zapewniony zostanie powrót do domu.'])]],
  [['Защита от неплатёжеспособности','Insolvency protection','Zabezpieczenie na wypadek niewypłacalności'],[

   ['6. Эгер биз өзгөртсөк же жокко чыгарсак','<p>Эгер шарттарды олуттуу өзгөртүүгө туура келсе, дароо кабарлайбыз: макул болсоңуз же толук кайтарым менен баш тартсаңыз болот. Эгер сапарды биз жокко чыгарсак, төлөгөнүңүздүн баарын 14 күндөн кечиктирбей кайтарабыз.</p><p>Сапарды башка адамга өткөрүп берсеңиз болот — ал үчүн башталышына 7 күндөн кечиктирбей бизге кабарлаңыз. Иш жүзүндөгү кошумча чыгымдар (мисалы, билеттерди кайра чыгаруу) өзүнчө төлөнөт.</p>'],

   ['8. Сапар учурунда жана доо-арыздар','<p>Эгер бир нерсе туура эмес болсо, дароо '+PH+' номерине же WhatsAppка кабарлаңыз — ошол жерде жардам беребиз. Доо-арызды '+E+' дарегине, телефон аркылуу же компаниянын дарегине жөнөтсөңүз болот. 14 күндүн ичинде жооп беребиз.</p><p>Талаштарды сүйлөшүү аркылуу, андан кийин — Кыргыз Республикасынын мыйзамдары боюнча сотто чечебиз. ЕБдеги кардарлар өз өлкөсүнүн керектөөчүлөрдүн укуктары боюнча милдеттүү нормалары берген коргоону сакташат; Польшада керектөөчүлөрдүн райондук же шаардык омбудсменине (rzecznik konsumentów) же Соода инспекциясына кайрылса болот.</p>'],

   ['Негизги укуктарыңыз',ul(['Келишимге чейин сапар тууралуу бардык маанилүү маалыматты аласыз.','Жок дегенде бир компания турдун бардык кызматтарынын аткарылышы үчүн жооп берет.','Шашылыш байланыш үчүн номер берилет.','Турду башка адамга өткөрүп берсеңиз болот, 7 күндөн кечиктирбей кабарлаңыз (кошумча чыгымдар болушу мүмкүн).','Баа белгилүү чыгымдар (күйүүчү май, салыктар, курс) өскөндө гана, эгер бул келишимде каралса жана башталышына 20 күндөн кечиктирбестен өсүшү мүмкүн. 8%дан ашык өсүш — баш тартуу укугу. Эгер бул чыгымдар азайса, баа да төмөндөйт.','Маанилүү шарттар олуттуу өзгөрсө, акысыз баш тартып, толук кайтарым алсаңыз болот. Эгер турду биз жокко чыгарсак — толук кайтарым жана зарыл болсо компенсация.','Барчу жерде өзгөчө жагдайлар болсо, мисалы, коопсуздукка олуттуу коркунуч туулса, акысыз баш тартсаңыз болот.','Башталышына чейин каалаган убакта жокко чыгаруу үчүн акылга сыярлык акы төлөп баш тартсаңыз болот.','Эгер сапарда маанилүү кызматтарды аткаруу мүмкүн болбосо, сизге кошумча акысыз ылайыктуу алмаштыруу сунушталат. Эгер кызматтар келишимге ылайык аткарылбаса жана биз аны оңдобосок — турдан баш тартып, бааны төмөндөтүүнү жана/же компенсацияны алсаңыз болот.','Эгер сапарда кыйын абалга туш болсоңуз, биз жардам берүүгө милдеттүүбүз.','Эгер уюштуруучу төлөөгө жөндөмсүз болуп калса, акчаңыз кайтарылат, ал эми турга ташуу кирсе — үйгө кайтып келүүңүз камсыздалат.'])],
   ['Төлөөгө жөндөмсүздүктөн коргоо','<p>'+G+'</p><p>Сапардагы шашылыш байланыш: '+PH+'.</p>'],
